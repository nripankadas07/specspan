[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "specspan"
version = "0.1.0"
description = "Deterministic Markdown requirement-to-code-to-test traceability and impact analysis."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "Nripanka Das"}]
keywords = ["requirements", "traceability", "specifications", "sarif", "agents"]
dependencies = []

[project.urls]
Homepage = "https://github.com/nripankadas07/specspan"
Repository = "https://github.com/nripankadas07/specspan"
Issues = "https://github.com/nripankadas07/specspan/issues"

[project.scripts]
specspan = "specspan.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
